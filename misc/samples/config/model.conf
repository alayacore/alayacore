name: "172.16.9.6:9999 / Local LLM (Anthropic)"
protocol_type: "anthropic"
base_url: "http://172.16.9.6:9999"
api_key: "nokey"
model_name: "noname"
context_limit: 262144

# The model's own output cap, and this window has to name one: the built-in
# 131072 default is calibrated for a 1M context (an eighth of it), so here it
# would leave the prompt half the window or less — and since a request is
# accepted only while prompt + max_tokens fits context_limit, that would cap the
# --auto-summarize threshold at 50% too. Any window of 262144 or less must set
# this. 65536 is the figure the shipped default names; it is a placeholder only
# in that this host's model is your own. See docs/context-tracking.md.
max_tokens: 65536
# Optional per-level provider wire-format JSON. Top-level keys become
# top-level keys of the request body. Omit any level you don't want to
# configure — the server will fall back to its own defaults.
reasoning_0: {"thinking":{"type":"disabled"}}
reasoning_1: {"thinking":{"type":"enabled"},"output_config":{"effort":"high"}}
reasoning_2: {"thinking":{"type":"enabled"},"output_config":{"effort":"max"}}

# Which key this endpoint uses for reasoning text (OpenAI protocol only).
# Read from the response delta AND used again when replaying reasoning.
# Omit to use the default, reasoning_content (DeepSeek, GLM, MiniMax, Qwen).
# Set to "reasoning" for vLLM, which renamed the key and no longer emits the
# old name. Anthropic needs neither — thinking arrives as a {"type":"thinking"}
# block inside content[].
#reasoning_field: "reasoning_content"

# Tool-calling mode. Omit it (or leave it false) for the behavior every version
# of alayacore has had: a step's tool calls run concurrently.
#
# true runs them one at a time, in the order the model made them, for models and
# servers with no notion of parallel tool calls. For protocol_type: openai it
# also sends "parallel_tool_calls": false in the request — opposite word, on
# purpose: that name is Chat Completions', this one is ours. The execution order
# applies to anthropic endpoints too; that protocol has no such field, so nothing
# is sent there.
#serial_tool_calls: true
