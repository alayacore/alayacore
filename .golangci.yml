# golangci-lint configuration for AlayaCore
# See https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional linters
    - bodyclose      # Check HTTP response body is closed
    # Reject a context.Context stored in a struct, and a context created fresh
    # where one is already in the call chain. Both have exemptions in the code,
    # each carrying the reason it is deserved — grep for nolint:containedctx and
    # nolint:contextcheck.
    - containedctx
    - contextcheck
    - dogsled        # Check for too many blank identifiers
    - dupl           # Check for duplicate code
    - copyloopvar    # Check for loop variable copies (replaces exportloopref)
    - gochecknoinits # Check for init functions
    - goconst        # Check for repeated strings that could be constants
    - gocritic       # Comprehensive Go source checker
    - gocyclo        # Check cyclomatic complexity
    - gofmt          # Check formatting
    - goimports      # Check imports
    - goprintffuncname # Check printf function names
    - gosec          # Security checker
    - misspell       # Check spelling
    - nakedret       # Check for naked returns
    - nolintlint     # Keep every //nolint named, explained, and still needed
    - noctx          # Check for HTTP requests without context
    - prealloc       # Check for preallocation suggestions
    - revive         # Fast, configurable, extensible linter
    - rowserrcheck   # Check for sql.Rows.Err close
    - sqlclosecheck  # Check for sql.Rows close
    - unconvert      # Check for unnecessary conversions
    - unparam        # Check for unused function parameters
    - whitespace     # Check for unnecessary whitespace

  disable:
    - typecheck  # Can be slow on large codebases

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    # issues.exclude-use-default is left at its default (true), and golangci-lint's
    # built-in EXC0001 exclusion swallows a set of errcheck reports with it —
    # unchecked Close and os.Remove among them. So a quiet errcheck is not evidence
    # the code is clean, and not evidence the linter is off either: a bare
    # f.Close() in a non-test file reports nothing as configured here, and reports
    # itself as soon as the run adds --exclude-use-default=false.

  govet:
    enable-all: true
    disable:
      - fieldalignment # Can be noisy

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  nolintlint:
    # Two syntactic rules, reliable and worth having: a directive must name the
    # linter it silences and say why. A bare "//nolint" does neither, covers every
    # linter that exists, and reads as a decision nobody recorded.
    require-explanation: true
    require-specific: true

    # Reporting unused directives is switched off explicitly, not by omission:
    # golangci-lint v1.64 does this by default, and with it on the same tree
    # flipped between 0 and 2 findings depending on cache state — a check that
    # cannot gate a build. It was also wrong both times it fired. Measured by
    # stripping every directive in a scratch worktree and running cold: 70 issues
    # surfaced, and output.go's and styles.go's nolint:revive lines were among
    # them, as unexported-return reports at exactly those positions. Live
    # directives, called dead.
    #
    # So finding a genuinely stale directive is a manual procedure, and a cheap
    # one: that same scratch worktree, cold run, then diff the surviving reports
    # against the directive list — lines that report nothing once unguarded are
    # the stale ones. That is how the nine deleted in this history were confirmed.
    allow-unused: true
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

issues:
  exclude-dirs:
    - vendor
    - testdata
  exclude-rules:
    # Exclude some linters from test files
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - goconst
        - gocyclo
        - errcheck
        - revive
        - govet

    # Exclude known issues in generated code
    - path: \.pb\.go
      linters:
        - all

    # Exclude goconst for terminal key handling - key strings are canonical
    - path: internal/adapters/terminal/
      linters:
        - goconst

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
