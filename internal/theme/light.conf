# Accent color — prompt text, focused borders, overlay titles, the display cursor's window line
primary: #1e66f5

# Dimmed color — unfocused borders, muted text
dim: #ccd0da

# Muted color — placeholders, secondary labels
muted: #9ca0b0

# Warning color — alerts, caution, confirmations
warning: #df8e1d

# Error color — errors, failures
error: #d20f39

# Added lines in diff
added: #40a02b

# Removed lines in diff
removed: #d20f39
