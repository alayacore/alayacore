name: Test

# What this workflow exists to prevent: the Bubble Tea fork removal (4edb5a85)
# deleted the only code that enabled ANSI processing on a Windows console, and
# nothing noticed. release.yml builds and publishes windows-amd64 and
# windows-arm64, but only at tag time, on ubuntu, with `make test` — which runs
# the suite for GOOS=linux. Between tags, no job ever compiled internal/adapters/terminal/*_windows.go.
#
# So the gate here is three things: the full suite and lint on Linux, a Windows
# job that type-checks every package (including test files) for GOOS=windows and
# runs the adapter suite there, and a build of every target release.yml
# publishes, on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    name: Linux (lint, vet, test, race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to the version this tree is clean under. Unpinned, the action
          # pulls the latest release, and a new check in someone else's linter
          # would fail the build for code nobody touched.
          version: v1.64.8
          # Built, not downloaded, and it cannot be downloaded: v1.64.8 is the
          # last v1 release, so its release binary is frozen at the Go that built
          # it (1.24), while golangci-lint refuses to load a config for a module
          # declaring a newer Go than that. goinstall compiles the same tag with
          # this job's own toolchain, so the pinned linters and the findings they
          # report are unchanged; the Makefile names this same version, bump both.
          # Moving to v2 instead means a config-schema migration plus every check
          # the linter gained since — its own change.
          install-mode: goinstall

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        # 25s on a dev box for the whole tree; cheap enough to always run.
        run: go test -race ./...

  windows:
    name: Windows (vet every package, test the adapter)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .gitattributes is the fix; this is the alarm. Git for Windows installs
      # with core.autocrlf=true and so rewrites the checkout to CRLF, which
      # gofmt reads as every file in the tree being unformatted — the whole
      # adapter, hundreds of findings, each pointing at line 1, none of them
      # about the code. Assert the checkout is LF so the failure names the
      # cause instead of burying it.
      - name: Check the checkout's line endings
        shell: bash
        run: |
          echo "effective core.autocrlf: $(git config --get core.autocrlf || echo unset)"
          if files=$(git grep -lI $'\r' -- '*.go'); then
            count=$(printf '%s\n' "$files" | wc -l)
            printf '%s\n' "$files" | awk 'NR<=10{print} END{if (NR>10) printf "... and %d more\n", NR-10}'
            echo "::error::$count .go files were checked out with CRLF, so gofmt will call every one of them unformatted. .gitattributes is what prevents this."
            exit 1
          fi
          echo "every .go file is LF."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # go vet type-checks for this job's GOOS, including _test.go files, so a
      # file like console_windows.go — which no Linux build ever reads — has to
      # compile here or the job says so.
      - name: Vet (GOOS=windows)
        run: go vet ./...

      # The suite that runs here is the terminal adapter: it owns the
      # windows_*.go files this job exists to protect, and it is written against
      # buffers rather than against a console, so it needs no TTY — a runner
      # hands `go test` pipes, never a console window. See
      # program_resize_poll_test.go and console_windows_test.go for the parts
      # that only have meaning on Windows and are portable to assert.
      #
      # Deliberately not included yet: internal/tools and internal/skills. Their
      # tests assert POSIX semantics — directory symlinks (a privileged
      # operation on Windows), umask and permission bits, and shell output from
      # sh — so running them here would turn this job red on the first push for
      # reasons that have nothing to do with the console. Widening it means
      # making each of those tests say what it actually requires, which is its
      # own change.
      - name: Test the terminal adapter
        run: go test ./internal/adapters/terminal/...

      # Lint here too, for the same package the job tests. It used to be left
      # out because `GOOS=windows golangci-lint run ./...` reported one finding
      # the Linux run could not see — Program.inputPaused, read only by the Unix
      # input loop — and that went away when parking the loop became shared code
      # (program_input.go). Scope is the adapter rather than ./... because
      # internal/tools/shell/terminate_windows.go carries findings of its own
      # (unchecked CloseHandle, a tainted taskkill argument), which are that
      # file's change to make and not the console's.
      - name: Lint the terminal adapter (GOOS=windows)
        env:
          GOOS: windows
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # Same reason as the Linux job: the release binary is an older-Go build
          # and cannot load this module at all.
          install-mode: goinstall
          args: ./internal/adapters/terminal/...

  cross-compile:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exactly the targets `make release-all` publishes.
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -o "dist/alayacore-${GOOS}-${GOARCH}${GOARM:+-${GOARM}}" .
